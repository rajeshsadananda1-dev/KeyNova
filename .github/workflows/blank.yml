name: Build KeyNova V3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract KeyNova project
        run: |
          unzip -o RJ_Version3_Github_Build_01_FIXED.zip -d extracted
          ls -la extracted
          find extracted -maxdepth 3 -type f | head -50

      - name: Build APK
        working-directory: extracted
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyNova-V3-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
